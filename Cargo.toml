[workspace]
resolver = "2"

members = ["circuit_mersenne_field", "wrapper", "wrapper_generator"]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ADI Foundation"]
homepage = "https://adi.foundation/"
repository = "https://github.com/ADI-Foundation-Labs/ADI-Stack-zkOS-Wrapper/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]


[workspace.dependencies]

circuit_mersenne_field = { path = "circuit_mersenne_field" }

boojum = { version = "=0.32.5", features = ["log_tracing"] }
bellman = { package = "zksync_bellman", version = "=0.32.5" }
rescue_poseidon = "=0.32.5"
snark_wrapper = "=0.32.5"

final_risc_verifier = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Airbender-System.git", package = "final_reduced_risc_v_machine_verifier", features = [
    "proof_utils",
], tag = "v0.5.2-b1" }
reduced_risc_verifier = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Airbender-System.git", package = "reduced_risc_v_log_23_machine_verifier", features = [
    "proof_utils",
], tag = "v0.5.2-b1" }
blake_verifier = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Airbender-System.git", package = "blake2_with_compression_verifier", features = [
    "proof_utils",
], tag = "v0.5.2-b1" }
execution_utils = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Airbender-System.git", package = "execution_utils", tag = "v0.5.2-b1" }
setups = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Airbender-System.git", package = "setups", tag = "v0.5.2-b1" }
mersenne_field = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Airbender-System.git", package = "field", tag = "v0.5.2-b1" }
zkos_verifier_generator = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Airbender-System.git", package = "verifier_generator", tag = "v0.5.2-b1" }
prover = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Airbender-System.git", package = "prover", tag = "v0.5.2-b1" }

serde_json = { version = "1.0" }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
clap = { version = "4.5.21", features = ["derive"] }
sha3 = "0.10"
rand = "0.8"
thiserror = "2"

# Used for GPU proving.
shivini = "=0.155.2"
proof-compression = "=0.155.2"
zksync-gpu-prover = "=0.155.2"

[profile.release.package."blake2_with_compression_verifier"]
opt-level = 1
codegen-units = 256
overflow-checks = true

[profile.release]
lto = false
# This is needed for zksync-airbender crates to compile in a reasonable time for x86-64-unknown-linux-gnu
overflow-checks = true

# Build against the ADI fork, which carries the per-stage reporting and the cancellable
# proving entry points. Only takes effect when this workspace is the build root; the
# prover repo carries the same block for its own graph.
[patch.crates-io]
boojum-cuda = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Lib-Crypto-GPU.git", tag = "v0.155.2-b2" }
era_cudart = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Lib-Crypto-GPU.git", tag = "v0.155.2-b2" }
era_cudart_sys = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Lib-Crypto-GPU.git", tag = "v0.155.2-b2" }
fflonk-cuda = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Lib-Crypto-GPU.git", tag = "v0.155.2-b2" }
proof-compression = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Lib-Crypto-GPU.git", tag = "v0.155.2-b2" }
shivini = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Lib-Crypto-GPU.git", tag = "v0.155.2-b2" }
zksync-gpu-ffi = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Lib-Crypto-GPU.git", tag = "v0.155.2-b2" }
zksync-gpu-prover = { git = "https://github.com/ADI-Foundation-Labs/ADI-Stack-Lib-Crypto-GPU.git", tag = "v0.155.2-b2" }
